# Configuração do servidor
server.port=${SERVER_PORT}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH}
server.forward-headers-strategy=native

# Configuração de compressão do servidor
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Configuração do Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL}

# Configuração de Similaridade (RAG)
app.similarity.rag-threshold=${SIMILARITY_RAG_THRESHOLD}
app.similarity.conversation-threshold=${SIMILARITY_CONVERSATION_THRESHOLD}
app.similarity.default-threshold=${SIMILARITY_DEFAULT_THRESHOLD}

# Configuração MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

# Log do MongoDB
logging.level.org.springframework.data.mongodb.core=WARN
logging.level.org.mongodb.driver=WARN

# Configuração Mongock (migrations)
mongock.enabled=true
mongock.migration-scan-package=com.caio.ollama_integration.migration
mongock.throw-exception-if-cannot-obtain-lock=false

# Configuração JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Configuração do Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.packages-to-scan=com.caio.ollama_integration.controller
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.filter=true

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.apache.catalina=${LOGGING_LEVEL_ORG_APACHE_CATALINA:INFO}
logging.level.org.apache.http=${LOGGING_LEVEL_ORG_APACHE_HTTP:INFO}
logging.level.org.apache.tomcat=${LOGGING_LEVEL_ORG_APACHE_TOMCAT:INFO}
logging.level.org.hibernate=${LOGGING_LEVEL_ORG_HIBERNATE:INFO}
logging.level.org.springframework=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}

# Configurações do Jackson para serialização e desserialização de datas
spring.jackson.serialization.write-dates-as-timestamps=${SPRING_JACKSON_SERIALIZATION_WRITE_DATES_AS_TIMESTAMPS:false}
spring.jackson.deserialization.adjust-dates-to-context-time-zone=${SPRING_JACKSON_DESERIALIZATION_ADJUST_DATES_TO_CONTEXT_TIME_ZONE:true}
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE:America/Sao_Paulo}

# Configuração de Timezone da aplicação
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE:America/Sao_Paulo}

# Configurações de upload (multipart)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuração Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=${KAFKA_PRODUCER_ACKS}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES}

# Log do Kafka
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients.consumer.internals.Fetcher=WARN
logging.level.org.apache.kafka.clients.producer.internals.Sender=WARN