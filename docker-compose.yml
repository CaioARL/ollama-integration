services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ollama-network
    # Baixar modelos automaticamente na inicialização
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull llama3.1:latest &
        ollama pull deepseek-coder:latest &
        ollama pull mixtral:latest &
        ollama pull deepseek-r1:latest &
        wait

volumes:
  ollama_data:
    driver: local

networks:
  ollama-network:
    driver: bridge
