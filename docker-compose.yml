services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ollama-network
    # Baixar modelos automaticamente na inicialização
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Iniciar ollama em background
        /bin/ollama serve &
        # Aguardar ollama iniciar
        sleep 5
        # Baixar modelos
        echo "Baixando modelos..."
        ollama pull llama3.2
        ollama pull mistral
        ollama pull codellama
        echo "Modelos baixados com sucesso!"
        # Manter container rodando
        wait

  # Opcional: Interface Web para gerenciar modelos
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ollama-network

volumes:
  ollama_data:
    driver: local

networks:
  ollama-network:
    driver: bridge
